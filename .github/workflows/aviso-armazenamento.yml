# Aviso de armazenamento do MCX Campo no WhatsApp da equipe MCX.
# Roda todo dia às 8h (Brasília): o sistema manda o relatório do dia e,
# em qualquer dia, o alerta ao passar de 80% e de 100% (sem repetir mensagens).
name: Aviso de armazenamento

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  aviso:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar armazenamento e avisar
        run: curl -fsS --retry 3 --retry-delay 30 --max-time 120 https://mcx-campo.onrender.com/api/cron/storage

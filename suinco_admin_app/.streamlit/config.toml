[theme]
# Paleta executiva MCX: azul-marinho profundo + dourado, a mesma
# combinação da logo (fundo marinho, "MCX" em prata/dourado).
base = "dark"
primaryColor = "#C9A227"
backgroundColor = "#0B1130"
secondaryBackgroundColor = "#161D42"
textColor = "#F2F3F7"
font = "sans serif"

[server]
headless = true

[client]
# Esconde o menu (⋮), botão "Deploy", ícone do GitHub e "Edit" — sem isso,
# qualquer visitante do app consegue abrir o código-fonte completo do
# repositório (inclusive de outras marcas/projetos) direto pelo navegador.
toolbarMode = "minimal"

# Configuração do projeto CAFÉ.
# Cada novo projeto (fase de expansão futura) ganha um arquivo igual a este,
# sem precisar alterar código.

project: cafe
display_name: "HL Café"

whatsapp:
  # Nome exato confirmado no WhatsApp Web (tem "bravo" no final).
  group_name: "Grupo HL Café bravo"

sheets:
  spreadsheet_id: "10eVqEdzrceWBiMpGY51s6KcLJsVE4dphdo0t_S0p8bg"
  # Aba específica do responsável "HL" (bate com o grupo do WhatsApp "Grupo HL Café").
  # Existe também uma aba "Café" geral e abas de outros responsáveis (Adriana, Patricia,
  # Joao P, etc.) — não usar essas, cada uma pertence a um projeto/responsável diferente.
  worksheet_name: "HL Cafe"

  # A linha 1 é um título mesclado ("CAFÉ BRAVO — Roteiro de Promotores"),
  # não o cabeçalho. O cabeçalho real está na linha 2 e os dados começam na linha 3.
  header_row: 2
  data_start_row: 3

  # Nome das colunas exatamente como aparecem na linha de cabeçalho (header_row) da aba.
  columns:
    rede: "REDE"
    marca: "MARCA"
    cidade: "CIDADE"
    vis: "VIS"
    dia_visita: "DIA VISITA"
    promo: "PROMO"
    resp: "RESP"
    vr_atend: "VR ATEND"
    semana_1: "1º SEM"
    semana_2: "2º SEM"
    semana_3: "3º SEM"
    semana_4: "4º SEM"
    semana_5: "5º SEM"
    total: "TOTAL"
    pct_cumpr: "% CUMPR"
    a_pagar: "A PAGAR"
    mes_ano: "MÊS/ANO"

  # Colunas calculadas por fórmula na planilha: o robô nunca escreve nelas.
  protected_columns:
    - "TOTAL"
    - "% CUMPR"
    - "A PAGAR"

  # Chave usada para localizar a linha correta: REDE + MÊS/ANO.
  # Se houver REDE duplicado no mesmo mês, usa CIDADE e depois MARCA como desempate.
  row_match_keys:
    primary: "rede"
    period: "mes_ano"
    tiebreakers:
      - "cidade"
      - "marca"

  # Formato do valor da coluna MÊS/ANO na planilha (ex.: "JAN/2026").
  month_year_format: "MMM/YYYY"
  month_abbreviations:
    1: "JAN"
    2: "FEV"
    3: "MAR"
    4: "ABR"
    5: "MAI"
    6: "JUN"
    7: "JUL"
    8: "AGO"
    9: "SET"
    10: "OUT"
    11: "NOV"
    12: "DEZ"

# Se REDE+MÊS/ANO não for encontrado, o robô NUNCA cria a linha sozinho
# (as linhas do mês já devem existir, preparadas manualmente).
# O caso vira uma pendência/erro no painel.
create_missing_row: false

# Limite mínimo de confiança para gravar automaticamente na planilha.
# Abaixo disso, o item vai para a fila de Pendências no Streamlit.
confidence_threshold: 0.95
